name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # tests/test_rerank.py loads the real reranker model; fastembed keeps it here, and the cache step below keeps it
    # between runs. An absolute path: fastembed does not expand ~.
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache

    # The backend tests run against this, as they do against docker-compose.yml's testdb locally.
    # No secrets: the tests set a fake OpenAI key and an unroutable base URL.
    services:
      testdb:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loreos_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The guard checkers are plain Node scripts with no dependencies: they read
      # .claude/harness.json and replay fixture payloads through the guards.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the backend
        run: uv --directory backend sync --locked

      - name: Install the frontend
        run: npm ci --prefix frontend

      # rerank.py names the model and uv.lock pins fastembed, so a change to either downloads afresh.
      - name: Cache the reranker model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed-cache
          key: fastembed-${{ hashFiles('backend/loreos/rerank.py', 'backend/uv.lock') }}

      # New check:* scripts go before check:all in package.json and at the
      # end of this list, so two branches never collide on the same line.
      - name: Claude guard fixtures
        run: npm run check:hooks

      - name: Codex adapter fixtures
        run: npm run check:agent-hooks

      - name: Backend tests
        run: npm run check:backend

      - name: Backend licenses
        run: npm run check:licenses

      - name: Spend guard on the live config
        run: npm run check:spend

      - name: Frontend typecheck, tests and build
        run: npm run check:frontend

  # The image builds and the stack starts healthy. Separate from checks because it builds the image every run.
  # No secrets: scripts/compose-check.yml gives every service its own database and a fake OpenAI key.
  compose:
    name: Compose
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Image, compose and the UI
        run: npm run check:compose
